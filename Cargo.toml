[package]
name = "open-agent-sdk"
version = "0.11.2"
edition = "2024"
rust-version = "1.85"
authors = ["Stephen Brandon"]
description = "Production-ready Rust SDK for building AI agents over two wire protocols: OpenAI chat completions (LMStudio, Ollama, llama.cpp, vLLM, OpenRouter) and Anthropic messages. Features streaming, tools, hooks, retry logic, and comprehensive examples."
documentation = "https://docs.rs/open-agent-sdk"
homepage = "https://github.com/slb350/open-agent-sdk-rust"
repository = "https://github.com/slb350/open-agent-sdk-rust"
readme = "README.md"
license = "MIT"
keywords = ["ai", "llm", "agent", "openai", "anthropic"]
categories = ["api-bindings", "asynchronous", "development-tools"]
exclude = [
    ".Codex/",
    ".githooks/",
    ".gitignore",
    ".github/",
    ".markdownlint.json",
    "AGENTS.md",
    "CLAUDE.md",
    "mutants.out/",
    "scripts/",
    "tests/ci_workflow_policy_test.rs",
    "tests/mutation_ci_scope_test.rs",
    "tests/fixtures/",
    "tests/mutation_scripts_test.rs",
    "tests/mutation_transport_scripts_test.rs",
    "tests/support/",
]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
# Async runtime
tokio = { version = "1.50", features = ["time"] }

# HTTP client
reqwest = { version = "0.12.28", features = ["json", "stream"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = "2.0"

# Async utilities
futures = "0.3.32"

# Streaming
eventsource-stream = "0.2"

# Random (for retry jitter)
rand = "0.10"

# Logging
log = "0.4.29"

# Base64 encoding for image support
base64 = { version = "0.23", default-features = false, features = ["std"] }

[dev-dependencies]
regex = "1.10"
criterion = "0.7"
env_logger = "0.11"
serde_yaml_ng = "0.10"
tempfile = "3.27"
# Pinned exactly: wiremock 0.6.5 uses let-chains and fails to build on the 1.85 MSRV.
wiremock = "=0.6.4"
# Runtime features are needed by tests and examples, not by library consumers.
# test-util provides the paused clock for deterministic backoff assertions.
tokio = { version = "1.50", features = ["macros", "rt-multi-thread", "net", "io-util", "sync", "test-util"] }

[lib]
name = "open_agent"
path = "src/lib.rs"
bench = false

[[bench]]
name = "performance"
harness = false

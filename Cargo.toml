[package]
name = "open-agent-sdk"
version = "0.11.11"
edition = "2024"
rust-version = "1.85"
authors = ["Stephen Brandon"]
description = "Production-ready Rust SDK for building AI agents over two wire protocols: OpenAI chat completions (LMStudio, Ollama, llama.cpp, vLLM, OpenRouter) and Anthropic messages. Features streaming, tools, hooks, retry logic, and comprehensive examples."
documentation = "https://docs.rs/open-agent-sdk"
homepage = "https://github.com/slb350/open-agent-sdk-rust"
repository = "https://github.com/slb350/open-agent-sdk-rust"
readme = "README.md"
license = "MIT"
keywords = ["ai", "llm", "agent", "openai", "anthropic"]
categories = ["api-bindings", "asynchronous", "development-tools"]
exclude = [
    ".cargo/",
    ".Codex/",
    ".githooks/",
    ".gitignore",
    ".github/",
    ".markdownlint.json",
    "AGENTS.md",
    "CLAUDE.md",
    "mutants.out/",
    "scripts/",
    "tests/ai1-transport.sh",
    "tests/fixtures/",
    "tests/repo_policy.rs",
    "tests/repo_policy/",
    "tests/support/",
]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
# Async runtime
tokio = { version = "1.50", features = ["time"] }

# HTTP client
reqwest = { version = "0.12.28", features = ["json", "stream"] }

# Security floor, not an API dependency: reqwest requires `url = "2.4"`, which admits
# url <= 2.5.8, and url is compiled in every build of this crate through it. Floor at the
# RUSTSEC-2026-0592 patched release so no downstream resolve can take a vulnerable version.
# Do not remove as "unused": the SDK calls no `url` API of its own.
url = "2.5.9"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = "2.0"

# Async utilities
futures = "0.3.32"

# Streaming
eventsource-stream = "0.2"

# Random (for retry jitter)
rand = "0.10"

# Logging
log = "0.4.29"

# Base64 encoding for image support
base64 = { version = "0.23", default-features = false, features = ["std"] }

[dev-dependencies]
# Plotting/HTML features are disabled; CI and local benchmarks use Criterion's CLI baselines.
criterion = { version = "0.7", default-features = false, features = ["cargo_bench_support"] }
serde_norway = "0.9"
tempfile = "3.27"
# Runtime features are needed by tests and examples, not by library consumers.
# test-util provides the paused clock for deterministic backoff assertions.
tokio = { version = "1.50", features = ["macros", "rt-multi-thread", "net", "io-util", "sync", "test-util"] }

[profile.mutants]
inherits = "test"
debug = 0

[lib]
name = "open_agent"
path = "src/lib.rs"
bench = false

[[bench]]
name = "performance"
harness = false

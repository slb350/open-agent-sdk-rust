name: Security Audit

on:
  schedule:
    # Backstop the proactive Sunday dependency-maintenance automation.
    # Monday 16:00 UTC is 08:00 PST / 09:00 PDT.
    - cron: '0 16 * * 1'
  # Allow manual trigger
  workflow_dispatch:

jobs:
  audit:
    name: Dependency Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/audit@v1
        with:
          # Create GitHub issues for vulnerabilities
          # Set to 'true' to enable issue creation
          createIssues: false

name: Security Audit

on:
  schedule:
    # Backstop the proactive Sunday dependency-maintenance automation.
    # Monday 16:00 UTC is 08:00 PST / 09:00 PDT.
    - cron: '0 16 * * 1'
  # Allow manual trigger
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Dependency Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/audit@72c09e02f132669d52284a3323acdb503cfc1a24 # v1.2.7
        with:
          denyWarnings: true
          createIssues: false

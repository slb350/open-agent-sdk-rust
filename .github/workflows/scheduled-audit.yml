name: Security Audit

on:
  schedule:
    # Backstop the proactive Sunday dependency-maintenance automation.
    # Monday 16:00 UTC is 08:00 PST / 09:00 PDT.
    - cron: '0 16 * * 1'
  # Allow manual trigger
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Dependency Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        with:
          toolchain: stable
      - name: Verify Rust toolchain
        run: |
          rustc --version
          cargo --version
      - name: Install cargo-audit
        # Do not use 0.22.2's upstream lockfile: it contains denied advisories.
        run: cargo install cargo-audit --version '=0.22.2' --no-default-features
      - name: Run security audit
        run: cargo audit --deny warnings

name: Publish crate

# A release is an annotated vX.Y.Z tag on main. Jobsy pushes it after its review job merges a release pull request; this workflow publishes that exact commit to crates.io through trusted publishing, so no registry token is stored anywhere.
# A tag whose own run failed is published by dispatching this workflow from main with the tag's name: the run checks and publishes the tag's commit under the workflow as main has it, so the tag never has to move.
# The job runs in the release environment, which deploys only from main and v* tags, and crates.io's trusted publisher requires that environment, so a copy of this workflow on any other ref cannot publish however it is triggered.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: The existing annotated vX.Y.Z tag to publish
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    name: Publish to crates.io and GitHub
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    permissions:
      contents: write
      id-token: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Require a vX.Y.Z tag name
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "$TAG is not a vX.Y.Z tag name" >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require an annotated tag on a commit main contains
        run: |
          git fetch --force origin "refs/tags/${TAG}:refs/tags/${TAG}"
          if [ "$(git cat-file -t "refs/tags/$TAG")" != tag ]; then
            echo "$TAG is not an annotated tag" >&2
            exit 1
          fi
          commit=$(git rev-parse "refs/tags/$TAG^{commit}")
          if [ "$commit" != "$(git rev-parse HEAD)" ]; then
            echo "tag $TAG moved to $commit after the checkout" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$commit" origin/main; then
            echo "tag $TAG points at $commit, which main does not contain" >&2
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
      - name: Require the tag to name the package version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          if [ "v$version" != "$TAG" ]; then
            echo "tag $TAG does not name package version $version" >&2
            exit 1
          fi
      # The notes go outside the checkout: `cargo publish --locked` refuses a working tree with an uncommitted file in it.
      - name: Take the release notes from the changelog
        run: |
          version="${TAG#v}"
          awk -v heading="## [$version]" 'index($0, heading) == 1 {found = 1; next} found && /^## \[/ {exit} found {print}' CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
          if [ ! -s "$RUNNER_TEMP/release-notes.md" ]; then
            echo "CHANGELOG.md has no section for $version" >&2
            exit 1
          fi
      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: Publish
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ env.TAG }}
          name: Open Agent SDK Rust ${{ env.TAG }}
          body_path: ${{ runner.temp }}/release-notes.md

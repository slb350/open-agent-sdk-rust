name: Publish crate

# A release is an annotated vX.Y.Z tag on main. Jobsy pushes it after its review job merges a release pull request; this workflow publishes that exact commit to crates.io through trusted publishing, so no registry token is stored anywhere.
# The job runs in the release environment, which deploys only from v* tags, and only repository admins can create, move or delete a v* tag. crates.io's trusted publisher requires that environment, so a copy of this workflow anywhere else cannot publish.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

jobs:
  publish:
    name: Publish to crates.io and GitHub
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    permissions:
      contents: write
      id-token: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require an annotated tag on a commit main contains
        run: |
          git fetch --force origin "refs/tags/${TAG}:refs/tags/${TAG}"
          if [ "$(git cat-file -t "refs/tags/$TAG")" != tag ]; then
            echo "$TAG is not an annotated tag" >&2
            exit 1
          fi
          commit=$(git rev-parse "refs/tags/$TAG^{commit}")
          if [ "$commit" != "$(git rev-parse HEAD)" ]; then
            echo "tag $TAG moved to $commit after the checkout" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$commit" origin/main; then
            echo "tag $TAG points at $commit, which main does not contain" >&2
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
      - name: Require the tag to name the package version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          if [ "v$version" != "$TAG" ]; then
            echo "tag $TAG does not name package version $version" >&2
            exit 1
          fi
      # The notes go outside the checkout: `cargo publish --locked` refuses a working tree with an uncommitted file in it.
      - name: Take the release notes from the changelog
        run: |
          version="${TAG#v}"
          awk -v heading="## [$version]" 'index($0, heading) == 1 {found = 1; next} found && /^## \[/ {exit} found {print}' CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
          if [ ! -s "$RUNNER_TEMP/release-notes.md" ]; then
            echo "CHANGELOG.md has no section for $version" >&2
            exit 1
          fi
      # A run that published but failed before the GitHub release is repaired by re-running it: a version crates.io already holds from this commit is not uploaded twice, and one it holds from any other commit fails the run.
      - name: Check whether crates.io already holds this version
        id: registry
        env:
          USER_AGENT: ${{ github.repository }} publish workflow (https://github.com/${{ github.repository }})
        run: |
          name=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].name')
          version="${TAG#v}"
          status=$(curl -sS -o /dev/null -w '%{http_code}' -A "$USER_AGENT" "https://crates.io/api/v1/crates/$name/$version")
          case "$status" in
            404)
              echo "published=false" >> "$GITHUB_OUTPUT"
              ;;
            200)
              published=$(curl -sSfL -A "$USER_AGENT" "https://static.crates.io/crates/$name/$name-$version.crate" | tar -xzO "$name-$version/.cargo_vcs_info.json" | jq -r .git.sha1)
              if [ "$published" != "$(git rev-parse HEAD)" ]; then
                echo "crates.io holds $name $version from $published, not from $TAG's commit" >&2
                exit 1
              fi
              echo "crates.io already holds $name $version from this commit; only the GitHub release is created"
              echo "published=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "crates.io answered HTTP $status for $name $version" >&2
              exit 1
              ;;
          esac
      - name: Authenticate with crates.io
        id: auth
        if: steps.registry.outputs.published == 'false'
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: Publish
        if: steps.registry.outputs.published == 'false'
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ env.TAG }}
          name: Open Agent SDK Rust ${{ env.TAG }}
          body_path: ${{ runner.temp }}/release-notes.md

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

permissions:
  contents: read

jobs:
  # Fast feedback: formatting check (fails in ~30s)
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all -- --check

  # Fast feedback: clippy lints
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo clippy --all-targets --all-features -- -D warnings

  # Linux matrix runs on both GitHub-hosted and family Gitea runners.
  test-linux:
    name: Test Suite (Linux, ${{ matrix.rust }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust: [stable, beta]
      fail-fast: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: linux-${{ matrix.rust }}
      - name: Run tests
        run: cargo test --all-features --all --verbose

  # The family Gitea runner is Linux-only; GitHub retains the macOS matrix.
  test-macos:
    name: Test Suite (macOS, ${{ matrix.rust }})
    if: github.server_url == 'https://github.com'
    # Gitea assigns a runner before evaluating the job condition. Give it an
    # available Linux label so it can mark this GitHub-only job as skipped.
    runs-on: ${{ github.server_url == 'https://github.com' && 'macos-latest' || 'ubuntu-latest' }}
    strategy:
      matrix:
        rust: [stable, beta]
      fail-fast: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: macos-${{ matrix.rust }}
      - name: Run tests
        run: cargo test --all-features --all --verbose

  # MSRV check: Ensure Rust 1.85 compatibility
  msrv:
    name: Minimum Supported Rust Version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: "1.85"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Check with MSRV
        run: cargo check --all-features --all

  # Security audit: Check for known vulnerabilities
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - name: Verify Rust toolchain
        run: |
          rustc --version
          cargo --version
      - name: Install cargo-audit
        # Do not use 0.22.2's upstream lockfile: it contains denied advisories.
        run: cargo install cargo-audit --version '=0.22.2' --no-default-features
      - name: Run security audit
        run: cargo audit --deny warnings

  # Documentation: Validate docs build for docs.rs
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -Dwarnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Build documentation
        run: cargo doc --no-deps --all-features

  # Code coverage: Tarpaulin report retained with the workflow run
  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install tarpaulin
        # Do not use 0.37.0's upstream lockfile: it pins vulnerable anyhow 1.0.102.
        run: cargo install cargo-tarpaulin --version =0.37.0
      - name: Generate coverage
        run: cargo tarpaulin --engine llvm --out xml --all-features --workspace
      - name: Verify coverage report
        run: test -s cobertura.xml
      - name: Retain coverage report
        if: github.server_url == 'https://github.com'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-${{ github.sha }}
          path: cobertura.xml
          if-no-files-found: error
          retention-days: 14

  # Benchmark comparison: Only run on PRs
  benchmarks:
    name: Benchmark Comparison
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Prepare base worktree
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git worktree add --detach "$RUNNER_TEMP/benchmark-base" "$BASE_SHA"
      - name: Benchmark base
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/criterion-target
        run: cargo bench --manifest-path "$RUNNER_TEMP/benchmark-base/Cargo.toml" --bench performance --all-features -- --save-baseline base
      - name: Benchmark pull request
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/criterion-target
        run: cargo bench --bench performance --all-features -- --baseline base

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '37 9 15 * *'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

permissions:
  contents: read

jobs:
  # Fast feedback: formatting check (fails in ~30s)
  fmt:
    name: Rustfmt
    if: &regular_ci github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all -- --check

  # Fast feedback: clippy lints
  clippy:
    name: Clippy
    if: *regular_ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo clippy --all-targets --all-features -- -D warnings

  # Linux matrix runs on GitHub-hosted runners.
  test-linux:
    name: Test Suite (Linux, ${{ matrix.rust }})
    if: *regular_ci
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust: [stable, beta]
      fail-fast: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: linux-${{ matrix.rust }}
      - name: Run tests
        run: cargo test --all-features --all --verbose

  # Preserve native macOS coverage on GitHub-hosted runners.
  test-macos:
    name: Test Suite (macOS, ${{ matrix.rust }})
    if: *regular_ci
    runs-on: macos-latest
    strategy:
      matrix:
        rust: [stable, beta]
      fail-fast: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: macos-${{ matrix.rust }}
      - name: Run tests
        run: cargo test --all-features --all --verbose

  # MSRV check: Ensure Rust 1.85 compatibility
  msrv:
    name: Minimum Supported Rust Version
    if: *regular_ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: "1.85"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # --all-targets so dev-dependencies are covered too. Checking only the library lets a
      # dev-dependency that requires a newer compiler land unnoticed, which silently breaks
      # `cargo test` for anyone on the MSRV.
      - name: Check with MSRV
        run: cargo check --all-features --all-targets --workspace

  # Security audit: Check for known vulnerabilities
  security:
    name: Security Audit
    if: *regular_ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - name: Verify Rust toolchain
        run: |
          rustc --version
          cargo --version
      - name: Install cargo-audit
        # Do not use 0.22.2's upstream lockfile: it contains denied advisories.
        run: cargo install cargo-audit --version '=0.22.2' --no-default-features
      - name: Run security audit
        run: cargo audit --deny warnings

  # Ordinary CI runs the full sweep only when its complete pushed or pull-request diff adds a
  # Rust test declaration. Monthly and manual runs are explicit full sweeps. The verdict still
  # comes from missed.txt through the shared script, never from cargo-mutants' ambiguous status.
  mutation-policy:
    name: Mutation policy
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.test-policy.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
        with:
          fetch-depth: 0
      - name: Detect newly added Rust tests
        id: test-policy
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BASE: ${{ github.event.before }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == schedule || "$EVENT_NAME" == workflow_dispatch ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$EVENT_NAME" == pull_request ]]; then
            base="$(git merge-base HEAD "origin/$BASE_REF")"
          elif [[ "$PUSH_BASE" =~ ^0+$ ]]; then
            base="$(git merge-base HEAD origin/main)"
          else
            base="$PUSH_BASE"
          fi
          git diff --unified=0 "$base" HEAD -- '*.rs' > "$RUNNER_TEMP/new-tests.diff"
          if grep -Eq '^\+[[:space:]]*#\[(test|[[:alnum:]_]+::test|rstest|test_case|case|parameterized)([[:space:](]|])' "$RUNNER_TEMP/new-tests.diff" ||
             grep -Eq '^\+[[:space:]]*//[/!][[:space:]]*```(rust)?' "$RUNNER_TEMP/new-tests.diff"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "new Rust tests detected; admitting the full mutation sweep"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "no new Rust tests detected; mutation work is omitted"
          fi

  mutants:
    name: Mutation Testing
    needs: mutation-policy
    if: needs.mutation-policy.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@742a3317eac7bd62f91cd888b4eead5e784ba833 # v2.87.1
        with:
          tool: cargo-mutants@27.1.0
      - name: Run mutation sweep
        run: ./scripts/mutants-run.sh

  # Documentation: Validate docs build for docs.rs
  docs:
    name: Documentation
    if: *regular_ci
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -Dwarnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Build documentation
        run: cargo doc --no-deps --all-features

  # Code coverage: Tarpaulin report retained with the workflow run
  coverage:
    name: Code Coverage
    if: *regular_ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install tarpaulin
        # Do not use 0.37.2's upstream lockfile: it pins vulnerable anyhow 1.0.102.
        run: cargo install cargo-tarpaulin --version =0.37.2
      - name: Generate coverage
        run: cargo tarpaulin --engine llvm --out xml --all-features --workspace
      - name: Verify coverage report
        run: test -s cobertura.xml
      - name: Retain coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-${{ github.sha }}
          path: cobertura.xml
          if-no-files-found: error
          retention-days: 14

  # Benchmark comparison: Only run on PRs
  benchmarks:
    name: Benchmark Comparison
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Prepare base worktree
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git worktree add --detach "$RUNNER_TEMP/benchmark-base" "$BASE_SHA"
      - name: Benchmark base
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/criterion-target
        run: cargo bench --manifest-path "$RUNNER_TEMP/benchmark-base/Cargo.toml" --bench performance --all-features -- --save-baseline base
      - name: Benchmark pull request
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/criterion-target
        run: cargo bench --bench performance --all-features -- --baseline base

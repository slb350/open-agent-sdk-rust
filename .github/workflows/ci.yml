name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '37 9 15 * *'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

permissions:
  contents: read

jobs:
  # Fast feedback: formatting check (fails in ~30s)
  fmt:
    name: Rustfmt
    if: &regular_ci github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all -- --check

  # Fast feedback: clippy lints
  clippy:
    name: Clippy
    if: *regular_ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo clippy --all-targets --all-features -- -D warnings

  # Linux matrix runs on GitHub-hosted runners.
  test-linux:
    name: Test Suite (Linux, ${{ matrix.rust }})
    if: *regular_ci
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust: [stable, beta]
      fail-fast: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: linux-${{ matrix.rust }}
      - name: Run tests
        run: cargo test --all-features --all --verbose

  # Preserve native macOS coverage on GitHub-hosted runners.
  test-macos:
    name: Test Suite (macOS, ${{ matrix.rust }})
    if: *regular_ci
    runs-on: macos-latest
    strategy:
      matrix:
        rust: [stable, beta]
      fail-fast: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: macos-${{ matrix.rust }}
      - name: Run tests
        run: cargo test --all-features --all --verbose

  # MSRV check: Ensure Rust 1.85 compatibility
  msrv:
    name: Minimum Supported Rust Version
    if: *regular_ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: "1.85"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # --all-targets so dev-dependencies are covered too. Checking only the library lets a
      # dev-dependency that requires a newer compiler land unnoticed, which silently breaks
      # `cargo test` for anyone on the MSRV.
      - name: Check with MSRV
        run: cargo check --all-features --all-targets --workspace

  # Security audit: Check for known vulnerabilities
  security:
    name: Security Audit
    if: *regular_ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
      - name: Verify Rust toolchain
        run: |
          rustc --version
          cargo --version
      - name: Install cargo-audit
        # Do not use 0.22.2's upstream lockfile: it contains denied advisories.
        run: cargo install cargo-audit --version '=0.22.2' --no-default-features
      - name: Run security audit
        run: cargo audit --deny warnings

  # Ordinary CI runs mutation only for added, modified, deleted, or renamed tests. Inline tests
  # scope to their owning source files; ambiguous integration tests and fixtures expand to the
  # full sweep. Monthly and manual runs are always full. Production-only revisions skip mutation.
  mutation-policy:
    name: Mutation policy
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.test-policy.outputs.run }}
      mode: ${{ steps.test-policy.outputs.mode }}
      base: ${{ steps.test-policy.outputs.base }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
        with:
          fetch-depth: 0
      - name: Classify mutation scope from test changes
        id: test-policy
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BASE: ${{ github.event.before }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == schedule || "$EVENT_NAME" == workflow_dispatch ]]; then
            run=true
            mode=full
            base=
          else
            if [[ "$EVENT_NAME" == pull_request ]]; then
              base="$(git merge-base HEAD "origin/$BASE_REF")"
            elif [[ "$PUSH_BASE" =~ ^0+$ ]]; then
              base="$(git merge-base HEAD origin/main)"
            else
              base="$PUSH_BASE"
            fi
            mapfile -t mutation_scope < <(./scripts/mutants-ci-scope.sh "$base" HEAD)
            mode="${mutation_scope[0]:-}"
            case "$mode" in
              none) run=false ;;
              files|full) run=true ;;
              *) echo "mutation policy returned invalid mode: $mode" >&2; exit 64 ;;
            esac
          fi
          {
            echo "run=$run"
            echo "mode=$mode"
            echo "base=$base"
          } >> "$GITHUB_OUTPUT"
          echo "mutation scope: $mode"

  # Every mutation workload runs on homelab-ai-1, under this repository's sandboxed role there.
  # This repository is public, so pull requests from forks never reach that runner.
  mutants:
    name: Mutation Testing
    needs: mutation-policy
    if: needs.mutation-policy.outputs.run == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, linux, x64, homelab-ai-1, open-agent-sdk-rust-mutants]
    # A full 262-mutant sweep took 9m37s alone on this runner at MUTANTS_JOBS=3, and 31 minutes
    # while two other repositories' sweeps shared the fleet's CPU and memory budget (2026-09-24).
    timeout-minutes: 90
    steps:
      # cargo-mutants builds every mutant in its own scratch copy of the tree, which excludes
      # target/, so an ordinary clean checkout loses nothing.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
      - uses: taiki-e/install-action@94c31af3204a9f15ab40b35ad084410b905bbc73 # v2.87.17
        with:
          tool: cargo-mutants@27.1.0
      - name: Run mutation sweep
        shell: bash
        env:
          MUTATION_BASE: ${{ needs.mutation-policy.outputs.base }}
          MUTATION_MODE: ${{ needs.mutation-policy.outputs.mode }}
        run: |
          set -euo pipefail
          mutation_args=()
          if [[ "$MUTATION_MODE" == files ]]; then
            mapfile -t mutation_scope < <(./scripts/mutants-ci-scope.sh "$MUTATION_BASE" HEAD)
            [[ "${mutation_scope[0]:-}" == files ]]
            mutation_args=("${mutation_scope[@]:1}")
          fi
          set +e
          ./scripts/mutants-run.sh "${mutation_args[@]}"
          status=$?
          set -e
          missed=target/mutants/mutants.out/missed.txt
          if [[ "$status" -eq 2 && -s "$missed" ]]; then
            report_dir="$RUNNER_TEMP/mutation-repair"
            mkdir -p "$report_dir"
            for report in missed.txt timeout.txt outcomes.json; do
              source_report="target/mutants/mutants.out/$report"
              [[ -f "$source_report" && ! -L "$source_report" ]] || continue
              cp -- "$source_report" "$report_dir/$report"
            done
          fi
          exit "$status"

      - name: Retain mutation repair evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-repair
          path: |
            ${{ runner.temp }}/mutation-repair/missed.txt
            ${{ runner.temp }}/mutation-repair/timeout.txt
            ${{ runner.temp }}/mutation-repair/outcomes.json
          if-no-files-found: ignore
          retention-days: 30

  # Documentation: Validate docs build for docs.rs
  docs:
    name: Documentation
    if: *regular_ci
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -Dwarnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Build documentation
        run: cargo doc --no-deps --all-features

  # Code coverage: Tarpaulin report retained with the workflow run
  coverage:
    name: Code Coverage
    if: *regular_ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install tarpaulin
        # Do not use 0.37.3's upstream lockfile: it pins vulnerable anyhow 1.0.102.
        run: cargo install cargo-tarpaulin --version =0.37.3
      - name: Generate coverage
        run: cargo tarpaulin --engine llvm --out xml --all-features --workspace
      - name: Verify coverage report
        run: test -s cobertura.xml
      - name: Retain coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-${{ github.sha }}
          path: cobertura.xml
          if-no-files-found: error
          retention-days: 14

  # Benchmark comparison: Only run on PRs
  benchmarks:
    name: Benchmark Comparison
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Prepare base worktree
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git worktree add --detach "$RUNNER_TEMP/benchmark-base" "$BASE_SHA"
      - name: Benchmark base
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/criterion-target
        run: cargo bench --manifest-path "$RUNNER_TEMP/benchmark-base/Cargo.toml" --bench performance --all-features -- --save-baseline base
      # Existing cases compare against base; new cases run without a prior measurement.
      - name: Benchmark pull request
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/criterion-target
        run: cargo bench --bench performance --all-features -- --baseline-lenient base

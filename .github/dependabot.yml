version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: saturday
      time: "06:00"
      timezone: America/Los_Angeles
    ignore:
      # Error::Http publicly exposes reqwest::Error; 0.13 requires the v0.7 boundary.
      - dependency-name: reqwest
        update-types:
          - version-update:semver-major
      # wiremock 0.6.5 uses let-chains and fails to compile on the Rust 1.85 MSRV.
      - dependency-name: wiremock
        versions:
          - "0.6.5"
    groups:
      cargo-dependencies:
        patterns:
          - "*"
    open-pull-requests-limit: 2

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: saturday
      time: "06:30"
      timezone: America/Los_Angeles
    groups:
      github-actions:
        patterns:
          - "*"
    open-pull-requests-limit: 2

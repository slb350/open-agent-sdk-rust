version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: saturday
      time: "06:00"
      timezone: America/Los_Angeles
    groups:
      cargo-dependencies:
        patterns:
          - "*"
    open-pull-requests-limit: 2

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: saturday
      time: "06:30"
      timezone: America/Los_Angeles
    groups:
      github-actions:
        patterns:
          - "*"
    open-pull-requests-limit: 2
